## Server Properties
server.port                                            = 8081
server.compression.enabled                             =true

## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
# Override via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD env vars in any non-local environment.
# The values below are local-development defaults only (they match docker-compose.yml's db service).
spring.datasource.url                                  = ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/polls?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false}
spring.datasource.username                             = ${SPRING_DATASOURCE_USERNAME:test}
spring.datasource.password                             = ${SPRING_DATASOURCE_PASSWORD:whyME}


## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect                = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto                          = update

## Hibernate Logging
logging.level.org.hibernate.SQL                        = DEBUG

# Initialize the datasource with available DDL and DML scripts
spring.sql.init.mode                                   = always
spring.jpa.defer-datasource-initialization             = true

## Jackson Properties
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS = false
spring.jackson.time-zone                               = UTC

## App Properties
# APP_JWT_SECRET must be set explicitly in any deployed environment (staging/prod) via a secret store
# (Kubernetes Secret, etc.) - it must never be committed to source control. The value below is an
# insecure, local-development-only default and must not be relied on outside a developer's machine.
app.jwtSecret                                          = ${APP_JWT_SECRET:fmfWm4d52UQpKhyA0V0T/pysrnzp0hS6hsYGAY2NYuzb7MAkH+N5nnpndJMFvkXtcEyKebIQht4mSyBnjSouQA==}
app.jwtExpirationInMs                                  = ${APP_JWT_EXPIRATION_MS:604800000}

# Comma separated list of allowed origins
app.cors.allowedOrigins                                = http://localhost:3000

